<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#00f2fe" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
  </defs>

  <!-- Background Circle & Glow -->
  <circle cx="256" cy="256" r="236" fill="#0c1222" stroke="#00f2fe" stroke-width="8" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="236" fill="url(#radarGlow)"/>

  <!-- Radar Rings -->
  <circle cx="256" cy="256" r="170" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="105" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="40" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Crosshair Lines -->
  <line x1="256" y1="20" x2="256" y2="492" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.2"/>
  <line x1="20" y1="256" x2="492" y2="256" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Battleship Graphic -->
  <path d="M120 286 L150 330 L362 330 L392 286 Z" fill="url(#shipGrad)" stroke="#ffffff" stroke-width="4"/>
  <!-- Superstructure -->
  <rect x="210" y="240" width="92" height="46" rx="4" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="236" y="205" width="40" height="35" rx="3" fill="#00f2fe"/>
  <!-- Mast & Radar -->
  <line x1="256" y1="205" x2="256" y2="160" stroke="#00f2fe" stroke-width="6" stroke-linecap="round"/>
  <line x1="240" y1="175" x2="272" y2="175" stroke="#00f2fe" stroke-width="4" stroke-linecap="round"/>
  <!-- Cannons -->
  <path d="M165 286 L195 286 L190 270 L170 270 Z" fill="#ffffff"/>
  <line x1="165" y1="276" x2="135" y2="270" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

  <path d="M317 286 L347 286 L342 270 L322 270 Z" fill="#ffffff"/>
  <line x1="347" y1="276" x2="377" y2="270" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

  <!-- Waves -->
  <path d="M80 360 C120 348 160 372 200 360 C240 348 280 372 320 360 C360 348 400 372 440 360" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" fill="none" stroke-opacity="0.8"/>
  <path d="M110 395 C150 385 190 405 230 395 C270 385 310 405 350 395 C390 385 410 395 430 395" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" fill="none" stroke-opacity="0.4"/>
</svg>
